{% if form %}
  <div class="card mt-3">
    <div class="card-header"><h3 class="card-title">{{ title|default:"Assign Jobs" }}</h3></div>
    <div class="card-body">
      <form method="post" action="{{ action_url }}">
        {% csrf_token %}
        {% include "includes/form_fields.html" with form=form %}
        {% if disabled_reason %}
          <span tabindex="0" data-bs-toggle="popover" data-bs-trigger="focus" data-bs-content="{{ disabled_reason }}">
            <button class="btn btn-secondary disabled" type="button" disabled>
              <i class="ti ti-outlined ti-lock" aria-hidden="true"></i>{{ submit_label|default:"Assign" }}
            </button>
          </span>
        {% else %}
          <button class="btn btn-primary" type="submit">
            <i class="ti ti-outlined ti-link" aria-hidden="true"></i>{{ submit_label|default:"Assign" }}
          </button>
        {% endif %}
      </form>
    </div>
  </div>
{% elif unavailable_message %}
  <div class="alert alert-info mt-3" role="status">
    {{ unavailable_message }}
  </div>
{% endif %}
